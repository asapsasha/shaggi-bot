<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ШАГГИ – Умный гид по прогулкам</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Стили для анимаций -->
    <style>
        /* Временные стили для проверки */
        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="logo-container">
                <h1 class="logo">ШАГГИ</h1>
                <div class="logo-subtitle">Умные маршруты</div>
            </div>
            <div class="loading-spinner">
                <i class="fas fa-shoe-prints"></i>
            </div>
            <p>Загрузка приложения...</p>
        </div>
    </div>
    
    <!-- Основное приложение -->
    <div id="app" class="app-container">
        <!-- Экраны будут созданы через JavaScript -->
    </div>
    
    <!-- Кнопка экстренной помощи -->
    <div class="emergency-panel">
        <button class="btn btn-emergency" onclick="emergencyButton()">
            <i class="fas fa-bell"></i><br>
            <span style="font-size: 12px;">SOS</span>
        </button>
    </div>
    
    <!-- Скрипты -->
    <script src="config.js"></script>
    <script src="app.js"></script>
    
    <!-- Скрипт для проверки загрузки -->
    <script>
        // Простая проверка загрузки
        console.log("✅ index.html загружен");
        
        // Проверяем загрузку скриптов
        setTimeout(function() {
            console.log("Проверка загрузки скриптов:");
            console.log("- window.AppConfig:", typeof window.AppConfig !== 'undefined' ? '✓' : '✗');
            console.log("- window.showScreen:", typeof window.showScreen !== 'undefined' ? '✓' : '✗');
            console.log("- window.emergencyButton:", typeof window.emergencyButton !== 'undefined' ? '✓' : '✗');
            
            // Проверяем видимость элементов
            setTimeout(function() {
                console.log("Состояние через 3 секунды:");
                console.log("- loading-screen:", document.getElementById('loading-screen') ? 'найден' : 'не найден');
                console.log("- app:", document.getElementById('app') ? 'найден' : 'не найден');
                
                // Принудительно показываем приложение, если что-то не так
                setTimeout(function() {
                    const loadingScreen = document.getElementById('loading-screen');
                    const app = document.getElementById('app');
                    
                    if (loadingScreen && app) {
                        loadingScreen.style.display = 'none';
                        app.style.display = 'block';
                        console.log("✅ Принудительно показали приложение");
                        
                        // Если экраны не создались, создаем простой экран
                        if (app.innerHTML.trim() === '') {
                            app.innerHTML = `
                                <div class="screen active" id="screen1">
                                    <div style="padding: 50px; text-align: center;">
                                        <h1 style="color: #6C5CE7;">ШАГГИ</h1>
                                        <p>Умные маршруты</p>
                                        <button class="btn" onclick="alert('Тестовая кнопка')">
                                            <i class="fas fa-shoe-prints"></i> Начать
                                        </button>
                                    </div>
                                </div>
                            `;
                            console.log("✅ Создали простой экран");
                        }
                    }
                }, 1000);
            }, 3000);
        }, 1000);
    </script>
</body>
</html>
